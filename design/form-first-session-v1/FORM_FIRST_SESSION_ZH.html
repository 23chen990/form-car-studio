function restore(raw){
  try{const x=JSON.parse(raw);if(x.v!==1||!Number.isSafeInteger(x.balance)||x.balance<0||x.balance>10000||!Array.isArray(x.history)||x.history.length>100||!Array.isArray(x.appliedPurchases)||!['paid','trial'].includes(x.policy))return initial();
    const route=['discover','photo','review','edit','task','result','garage'].includes(x.route)?x.route:'discover';
    for(const v of x.history){if(typeof v.id!=='string'||typeof v.jobId!=='string'||!COLORS[v.recipe?.body]||!COLORS[v.recipe?.wheel])return initial();}
    if(x.job&&!['queued','processing','uncertain','succeeded','failed','cancelled'].includes(x.job.phase))return initial();
    return {...initial(x.policy),...x,route,sheet:null};
  }catch{return initial();}

 root.innerHTML=`<div class="workspace"><aside class="brief"><a class="brand" href="#">FORM<span class="brand-line"></span></a><p class="eyebrow">FIRST-SESSION DESIGN / 01</p><h2>From curiosity<br>to a look worth<br><em>keeping.</em></h2><p class="brief-copy">A complete mobile journey: discover, choose a photo, understand the cost, create, compare and refine.</p><div class="reviewer-alert"><strong>尚未达到“看到就想上传”的体验目标</strong><p>这份中文版本用于找出卡点，不代表产品已具备竞品级视觉吸引力。优先凭直觉评价首页效果图与上传动机。</p></div><div class="principle"><b>01</b><p><strong>Show the change.</strong><br>One clear example beats a long introduction.</p></div><div class="principle"><b>02</b><p><strong>Keep the intent.</strong><br>Sign-in and checkout never erase a choice.</p></div><div class="principle"><b>03</b><p><strong>Make the next step optional.</strong><br>A result is yours to keep, not a locked sales teaser.</p></div><div class="lab" aria-label="Prototype reviewer controls"><h3>REVIEW SCENARIOS</h3><div class="lab-grid">${[['paid','New user / paid'],['trial','Trial hypothesis'],['ready','Existing credits'],['slow','Long wait'],['uncertain','Interrupted'],['failed','Failed request'],['pending','Payment pending']].map(([id,x])=>`<button data-scenario="${id}">${x}</button>`).join('')}</div><label class="toggle"><input id="auto" type="checkbox" ${auto?'checked':''}> Advance simulated tasks</label><label class="toggle"><input id="online" type="checkbox" ${state.online?'checked':''}> Simulated connection available</label><div class="lab-actions">${btn('Start processing','process','quiet')}${btn('Complete task','complete','quiet')}${btn('Return no change','fail','quiet')}</div><p id="debug" class="debug">${state.submissions} submitted / ${state.history.length} outputs / ${state.balance} demo credits</p><p class="fine">No network calls. No real purchases.<br>Controls here are not part of the shipped app.</p></div></aside><div class="phone-column"><details class="mobile-lab"><summary>切换验收场景（点这里）</summary><div class="mobile-lab-grid"><button type="button" data-scenario="paid">新用户 / 需购买</button><button type="button" data-scenario="trial">一次试用（假设）</button><button type="button" data-scenario="ready">已有额度</button><button type="button" data-scenario="slow">等待很久</button><button type="button" data-scenario="uncertain">任务中断</button><button type="button" data-scenario="failed">生成失败</button><button type="button" data-scenario="pending">付款待确认</button></div><p>这是模拟器场景选择，不是正式 App 的功能。</p></details><p class="prototype-label"><span class="status-dot"></span> INTERACTIVE STUDY &middot; NO AI OR PAYMENTS</p><section class="device" aria-label="FORM mobile prototype"><header class="app-header">${state.route==='discover'?'<span class="wordmark">FORM</span>':`<button class="iconbtn" data-action="back" aria-label="Back">${icon('back')}</button><span class="small-brand">FORM</span>`}<div class="header-right">${state.signedIn?`<button class="balance" data-action="purchase">${state.balance} demo credits</button>`:''}<button class="iconbtn" data-action="help" aria-label="About this prototype">${icon('help')}</button></div></header>${!state.online?'<div class="offline" role="status">Offline simulation - new requests are paused</div>':''}${active(state)&&state.route!=='task'?`<button class="task-banner" data-action="task">${icon('clock')} Your request is still here ${icon('arrow')}</button>`:state.job?.phase==='succeeded'&&state.route!=='result'?`<button class="task-banner" data-action="open-result">${icon('check')} Your example is ready ${icon('arrow')}</button>`:''}<main class="content" id="screen" data-screen="${state.route}">${screen()}</main><nav class="bottom-nav" aria-label="Main navigation"><button data-action="home" aria-current="${state.route==='discover'?'page':'false'}">${icon('spark')} Discover</button><button data-action="garage" aria-current="${state.route==='garage'?'page':'false'}">${icon('garage')} Garage</button></nav><div class="message" role="status" aria-live="polite">${esc(state.message||'')}</div></section><p class="under-phone">FORM / MOBILE EXPERIENCE PROTOTYPE / V1.0</p></div></div><input id="photo-input" type="file" accept="image/jpeg,image/png,image/webp" hidden><dialog aria-label="${esc(state.sheet||'Dialog')}"><button class="iconbtn dialog-close" data-action="close" aria-label="Close dialog">${icon('close')}</button><div class="dialog-content">${dialogContent()}</div></dialog>`;
 const d=document.querySelector('dialog');if(state.sheet)d.showModal();
 const content=document.querySelector('.content');
 const dock=content?.querySelector('.cta-zone'); if(dock){dock.classList.add('primary-dock');document.querySelector('.bottom-nav').before(dock);}
 if(content)content.scrollTop=priorScroll;
 localizeUI(root);
 bind();try{sessionStorage.setItem(KEY,serialize(state));}catch{}
}
function send(e){const oldRoute=state.route,oldSheet=state.sheet,el=document.activeElement,focus=el?.getAttribute('data-action');const selection=['action','field','value','id'].filter(k=>el?.dataset?.[k]).map(k=>`[data-${k}="${el.dataset[k]}"]`).join('');state=reduce(state,{now:Date.now(),...e});render();if(state.route!==oldRoute){document.querySelector('.content').scrollTop=0;document.querySelector('h1')?.focus({preventScroll:true});}else if(oldSheet&&!state.sheet){document.querySelector(`[data-action="${priorFocus||focus||'next'}"]`)?.focus({preventScroll:true});}if(selection&&oldRoute===state.route&&oldSheet===state.sheet)document.querySelector(selection)?.focus({preventScroll:true});if(!oldSheet&&state.sheet)priorFocus=focus;}
function bind(){
 document.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',()=>action(el)));
 document.querySelectorAll('[data-scenario]').forEach(el=>el.addEventListener('click',()=>scenario(el.dataset.scenario)));
 document.getElementById('auto').addEventListener('change',e=>{auto=e.target.checked;});
 document.getElementById('online').addEventListener('change',e=>send({type:'NETWORK',online:e.target.checked}));
 document.getElementById('demo-consent')?.addEventListener('change',e=>{document.querySelector('[data-action="consent-ok"]').disabled=!e.target.checked;});
 document.querySelector('dialog').addEventListener('cancel',e=>{e.preventDefault();send({type:'CLOSE'});});
 document.getElementById('photo-input').addEventListener('change',async e=>{
  const file=e.target.files?.[0];if(!file)return;
  if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>10*1024*1024){state.message='Choose a JPEG, PNG or WebP under 10 MiB. HEIC needs the native import adapter.';render();return;}
  const url=URL.createObjectURL(file);try{const image=new Image();image.src=url;await image.decode();if(image.naturalWidth*image.naturalHeight>40000000)throw Error('dimensions');
    if(localURL)URL.revokeObjectURL(localURL);localURL=url;send({type:'SOURCE',kind:'local'});
  }catch{URL.revokeObjectURL(url);state.message='This file could not be previewed safely. Choose another photo.';render();}
 });
}
function action(el){const a=el.dataset.action;
 if(a==='compare'||a==='original'||a==='styled'){compare=a==='compare'?!compare:a==='original';render();document.querySelector(`[data-action="${a}"]`)?.focus({preventScroll:true});return;}
 if(a==='pick'){document.getElementById('photo-input').click();return;}
 if(a==='download'){const v=state.history.find(x=>x.id===state.selected);if(!v)return;const blob=new Blob([car(v.recipe).replace('class="car-art"','xmlns="http://www.w3.org/2000/svg"')],{type:'image/svg+xml'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='FORM-illustrated-example.svg';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);state.message='Example SVG download requested. This does not confirm a Photos save.';render();return;}
 if(a==='export-compare'){compare=true;send({type:'CLOSE'});return;}
 if(a==='back'){if(state.route==='review')send({type:'NAV',route:'photo'});else if(state.route==='edit')send({type:'NAV',route:state.history.length?'result':'review'});else send({type:'NAV',route:'discover'});return;}
 const map={start:{type:'START'},direct:{type:'START',detail:true},sample:{type:'SOURCE',kind:'sample'},'remove-source':{type:'REMOVE_SOURCE'},next:{type:'NEXT'},close:{type:'CLOSE'},'auth-ok':{type:'AUTH_OK'},'consent-ok':{type:'CONSENT_OK'},'trial-ok':{type:'TRIAL_OK'},'purchase-verify':{type:'PURCHASE_VERIFY'},'purchase-ok':{type:'PURCHASE_OK'},'purchase-cancel':{type:'PURCHASE_CANCEL'},'reset-draft':{type:'RESET_DRAFT'},review:{type:'NAV',route:'review'},favorite:{type:'FAVORITE'},refine:{type:'REFINE'},home:{type:'NAV',route:'discover'},garage:{type:'NAV',route:'garage'},task:{type:'NAV',route:'task'},cancel:{type:'CANCEL'},retry:{type:'RETRY_REVIEW'},process:{type:'PROCESS'},complete:{type:'COMPLETE'},fail:{type:'FAIL',reason:'unchanged'},logout:{type:'LOGOUT'}};
 if(['help','problem','export','purchase'].includes(a)){if(a==='purchase'&&!state.signedIn){state.sheet='auth';render();return;}send({type:'SHEET',id:a});return;}
 if(a==='open-result'){send({type:'SELECT_VERSION',id:state.job?.resultId});return;}
 if(a==='style'){send({type:'STYLE',id:el.dataset.id});compare=false;return;}
 if(a==='color'){send({type:'COLOR',field:el.dataset.field,value:el.dataset.value});return;}
 if(a==='version'){send({type:'SELECT_VERSION',id:el.dataset.id});compare=false;return;}
 if(a==='buy'){send({type:'BUY',units:Number(el.dataset.units)});return;}
 if(a==='report'){send({type:'REPORT',category:el.dataset.category});return;}
 if(map[a])send(map[a]);
}
function scenario(id){state=initial(id==='trial'?'trial':'paid');compare=false;auto=!['slow','uncertain','failed'].includes(id);if(localURL){URL.revokeObjectURL(localURL);localURL=null;}
 if(!['paid','trial'].includes(id)){state.source={kind:'sample'};state.route='review';state.signedIn=true;state.consent=true;state.balance=id==='pending'?0:2;}
 if(['slow','uncertain','failed'].includes(id)){state=reduce(state,{type:'SUBMIT',now:Date.now()});state=reduce(state,{type:'PROCESS'});if(id==='uncertain')state=reduce(state,{type:'UNCERTAIN'});if(id==='failed')state=reduce(state,{type:'FAIL'});}
 if(id==='pending'){state.sheet='purchase';state=reduce(state,{type:'BUY',units:5});}
 render();document.querySelector('.content').scrollTop=0;
}
setInterval(()=>{if(!auto||document.hidden||!state.online||!active(state)||state.job.phase==='uncertain')return;const age=Date.now()-state.job.createdAt;if(state.job.phase==='queued'&&age>1400)send({type:'PROCESS'});else if(state.job.phase==='processing'&&age>6500)send({type:'COMPLETE'});},400);
window.addEventListener('pagehide',()=>{try{sessionStorage.setItem(KEY,serialize(state));}catch{}});
render();

})();</script></body></html>
